version: 2

updates:
  # ── Backend (Node/npm) ──────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # Batch minor/patch updates for Prisma together
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
        update-types:
          - "minor"
          - "patch"
      # Batch minor/patch updates for BullMQ / Bull Board together
      queue:
        patterns:
          - "bullmq"
          - "@bull-board/*"
        update-types:
          - "minor"
          - "patch"
      # Group all TypeScript type packages
      typescript-types:
        patterns:
          - "@types/*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Keep major version bumps as individual PRs for review
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsonwebtoken"
        update-types: ["version-update:semver-major"]

  # ── Frontend (Node/npm) ─────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # Batch React ecosystem minor/patch updates
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "minor"
          - "patch"
      # Batch Next.js related updates
      nextjs:
        patterns:
          - "next"
          - "next-auth"
        update-types:
          - "minor"
          - "patch"
      # Group TypeScript types
      typescript-types:
        patterns:
          - "@types/*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next-auth"
        update-types: ["version-update:semver-major"]
      # Tailwind v4 moved its PostCSS plugin to @tailwindcss/postcss and
      # changed the config format entirely — requires a deliberate migration.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # TypeScript v7 drops CommonJS output and has breaking changes
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node major bumps can break TS compilation
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # autoprefixer major bumps may drop PostCSS compat
      - dependency-name: "autoprefixer"
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions ──────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
