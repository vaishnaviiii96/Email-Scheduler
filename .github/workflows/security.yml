name: Secret & Dependency Scanning

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]
  schedule:
    # Run a full scan every Sunday at 02:00 UTC to catch newly-published
    # detectors and secrets committed in non-PR branches.
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read          # checkout
  security-events: write  # upload SARIF to GitHub Advanced Security

jobs:
  # ── 1. TruffleHog Secret Scanning ──────────────────────────────────────────
  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history required for both scan modes

      # PR mode: scan only the commits introduced by this PR (fast, targeted)
      # Known limitation: secrets committed before the PR base SHA are not scanned here;
      # the weekly schedule job covers full history.
      - name: TruffleHog — PR diff scan
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.sha }}
          extra_args: --only-verified

      # Push / schedule mode: scan entire repo history
      # Known limitation: --only-verified skips rotated credentials that no longer
      # authenticate, even if the raw value remains readable in git history.
      - name: TruffleHog — full history scan
        if: github.event_name != 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

  # ── 2. npm audit — Backend ──────────────────────────────────────────────────
  audit-backend:
    name: npm audit · Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies (CI mode — no scripts)
        run: npm ci --ignore-scripts

      - name: Run npm audit (fail on high/critical CVEs)
        # --audit-level=high  → exit 1 only for high or critical severities
        # --json              → machine-readable output for the next step
        run: npm audit --audit-level=high --json | tee audit-backend.json || true

      - name: Display audit summary
        if: always()
        run: |
          echo "### Backend npm audit results" >> $GITHUB_STEP_SUMMARY
          if command -v jq &>/dev/null; then
            jq -r '
              .vulnerabilities // {} | to_entries[] |
              "| \(.key) | \(.value.severity) | \(.value.via[0].url // "n/a") |"
            ' audit-backend.json \
              | { echo "| Package | Severity | Advisory |"; echo "|---|---|---|"; cat; } \
              >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No vulnerabilities found." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail on high/critical vulnerabilities
        run: npm audit --audit-level=high

  # ── 3. npm audit — Frontend ─────────────────────────────────────────────────
  audit-frontend:
    name: npm audit · Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (CI mode — no scripts)
        run: npm ci --ignore-scripts

      - name: Run npm audit (fail on high/critical CVEs)
        run: npm audit --audit-level=high --json | tee audit-frontend.json || true

      - name: Display audit summary
        if: always()
        run: |
          echo "### Frontend npm audit results" >> $GITHUB_STEP_SUMMARY
          if command -v jq &>/dev/null; then
            jq -r '
              .vulnerabilities // {} | to_entries[] |
              "| \(.key) | \(.value.severity) | \(.value.via[0].url // "n/a") |"
            ' audit-frontend.json \
              | { echo "| Package | Severity | Advisory |"; echo "|---|---|---|"; cat; } \
              >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No vulnerabilities found." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail on high/critical vulnerabilities
        run: npm audit --audit-level=high

  # ── 4. OSV-Scanner — cross-ecosystem SCA ────────────────────────────────────
  osv-scan:
    name: OSV-Scanner (SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action@v2
        with:
          scan-args: |-
            --recursive
            --skip-git
            ./
        continue-on-error: true   # report findings without hard-blocking the build
