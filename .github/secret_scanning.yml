# GitHub Secret Scanning — Push Protection Configuration
#
# This file is read by GitHub's native secret scanning engine.
# It does NOT replace TruffleHog; it extends coverage at the platform level.
#
# Prerequisites (one-time, in repo Settings → Security):
#   1. Enable "Secret scanning"          → Alerts tab appears under Security
#   2. Enable "Push protection"          → blocks pushes containing detected secrets
#   3. (Optional) Add custom patterns    → Settings → Security → Secret scanning
#
# The sections below document custom patterns to complement GitHub's built-in
# 200+ detector library.  Add entries as your secret surface grows.
#
# Reference: https://docs.github.com/en/code-security/secret-scanning/defining-custom-patterns

# Custom patterns (PCRE2 syntax)
# Uncomment and adapt once you have confirmed pattern syntax in the GitHub UI first.
#
# custom_patterns:
#   - name: "Internal API Key"
#     pattern: "isk_[a-zA-Z0-9]{32}"
#     keywords:
#       - "isk_"
#
#   - name: "Internal Service Token"
#     pattern: "svc_[a-zA-Z0-9]{40}"
#     keywords:
#       - "svc_"
